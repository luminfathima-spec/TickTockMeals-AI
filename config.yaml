# TickTock Meals Configuration

llm:
  # LLM execution mode: 'mock' (offline fixtures/stubs) or 'live' (Gemini API)
  # Overridden by environment variable LLM_MODE if set.
  mode: "mock"

  # Model names live ONLY in config.yaml - never hardcode in application code.
  models:
    MODEL_FAST: "gemini-2.5-flash"
    MODEL_VISION: "gemini-2.5-flash"
    MODEL_EMBED: "text-embedding-004"

  # Free-tier rate limiter (calls per minute)
  rate_limit_per_minute: 10

  # Daily call budget for free-tier quota protection
  daily_call_budget: 100

  # Soft budget threshold ratio (switches to cache-only before hard limit)
  soft_budget_threshold_pct: 0.85

  # On-disk response cache directory
  cache_dir: ".cache"

# SQLite database file path
db_path: "data/ticktockmeals.db"

# Average transit speeds for ETA calculation (km/h)
# Adjustable assumption to be sourced in README
avg_speed_kmph:
  bike: 22.0
  car: 25.0

# Handover buffer time added to ETA (minutes)
# Adjustable assumption to be sourced in README
handover_buffer_minutes: 15

# Minimum useful window remaining for human rescue (minutes)
# Below this threshold, food cascades to animal feed
min_human_window_minutes: 45

# Additional duration (hours) food remains suitable for animal feed after human window
animal_window_hours: 2.0

# Duration (hours) food remains viable for compost/biogas before discarding
compost_window_hours: 24.0

# Animal feed toxic ingredient exclusions (dishes containing these skip animal tier)
animal_exclusions:
  - "onion"
  - "garlic"
  - "chocolate"
  - "cocoa"
  - "sweet"
  - "spicy"
  - "chilli"
  - "chili"
  - "salt"
  - "curry"
  - "sambar"
  - "biryani"
  - "masala"
  - "dal tadka"
  - "jamun"
  - "pak"

# Matching scoring weights (must sum to ~1.0)
# Adjustable assumption to be sourced in README
scoring_weights:
  urgency: 0.35
  proximity: 0.25
  capacity: 0.20
  diet: 0.10
  hours: 0.10

# Matching safety margin (minutes) deducted from remaining safe window
match_safety_margin_minutes: 15

# Response timeout (minutes) before escalating to the next candidate
match_response_timeout_minutes: 15

# Environmental and meal impact factors
# Adjustable assumption to be sourced in README
impact_factors:
  kg_per_meal: 0.4            # Average portion weight (kg per meal)
  co2e_kg_per_kg_food: 2.5    # Avoided CO2 equivalent emission factor (kg CO2e / kg food)
